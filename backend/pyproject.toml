[project]
name = "sogamoso-dashboard-api"
version = "0.1.0"
description = "API de carga, validación y análisis de indicadores de tamización de cáncer - Sogamoso"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9.0",
  "pwdlib[argon2]>=0.2.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "statsmodels>=0.14.0",
  "numpy>=1.26.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
